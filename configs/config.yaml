# SonicScope AI Configuration
# Single source of truth for paths, hyperparameters, and pipeline settings.
# Section references correspond to docs/PLAN.md.

seed: 42
device: auto

# Dataset configuration (PLAN §06)
dataset:
  min_track_seconds: 25.0

# File and directory paths relative to the project root (PLAN §05, Addendum A3)
paths:
  data_root: data
  raw_dir: data/raw
  fma_small_dir: data/raw/fma_small
  fma_metadata_dir: data/raw/fma_metadata
  processed_dir: data/processed
  cache_dir: data/cache
  manifest_path: data/processed/manifest.csv
  features_path: data/processed/features.parquet
  label_map_path: data/processed/label_map.json
  norm_stats_path: data/processed/norm_stats.json
  similarity_index_path: data/processed/similarity_index.joblib
  spectrogram_cache_dir: data/cache/logmels
  models_dir: models
  baseline_model_path: models/baseline/random_forest.joblib
  cnn_checkpoint_path: models/checkpoints/genre_cnn.pt
  reports_dir: reports
  metrics_dir: reports/metrics
  figures_dir: reports/figures
  screenshots_dir: reports/screenshots

# Deterministic audio processing contract (PLAN §07)
audio:
  sample_rate: 22050
  duration: 30
  window_duration: 10
  windows_per_track: 3
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  f_min: 0.0
  f_max: null
  power: 2.0
  mono: true
  max_duration_seconds: 900
  max_upload_mb: 30
  allowed_formats:
    - mp3
    - wav
    - m4a

# Classical baseline Random Forest grid and settings (PLAN §08)
baseline:
  random_state: 42
  param_grid:
    n_estimators:
      - 200
      - 400
    max_depth:
      - 12
      - null

# 2D CNN architecture and training recipe (PLAN §09)
cnn:
  architecture:
    in_channels: 1
    dropout: 0.3
  training:
    optimizer: AdamW
    learning_rate: 0.001
    batch_size: 32
    epochs: 25
    early_stopping_patience: 5
    weight_decay: 0.01

# Song similarity engine settings (PLAN §12, Addendum A)
similarity:
  exact_match_threshold: 0.999

